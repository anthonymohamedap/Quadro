<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Verkoopdossier mock</title>
<style>
:root{--dark:#444A50;--dark2:#50575e;--yellow:#F5C242;--yellowh:#FFECB3;--txt:#222;--sec:#6B7280;--bd:#E5E7EB;--bg:#F4F5F7;--card:#fff;--muted:#F9FAFB;
--blueBg:#EFF6FF;--blue:#1D4ED8;--orBg:#FFF7ED;--or:#9A3412;--redBg:#FEF2F2;--red:#991B1B;--puBg:#FDF4FF;--pu:#7E22CE;--grBg:#ECFDF5;--gr:#047857;--grD:#16A34A}
*{box-sizing:border-box}body{margin:0;font-family:"Inter","Segoe UI",system-ui,sans-serif;color:var(--txt);background:var(--bg);font-size:14px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--dark);color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:2px}
aside .logo{background:#fff;border-radius:6px;padding:8px;width:120px;margin:4px 0 18px 6px}aside .logo img{width:100%;display:block}
aside .grp{font-size:11px;letter-spacing:.06em;color:#B8BEC4;margin:14px 10px 4px}
aside a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#fff;text-decoration:none}
aside a.on{background:var(--dark2);box-shadow:inset 3px 0 0 var(--yellow)}aside a .i{width:18px;text-align:center}
main{padding:24px 28px;display:flex;flex-direction:column;gap:16px;min-width:0}
h1{font-size:24px;margin:0}h2{font-size:16px;margin:0}.sec{color:var(--sec)}.sm{font-size:12.5px}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:8px 14px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn.pri{background:var(--yellow);border-color:var(--yellow)}.btn.dan{color:var(--red)}.btn.sm2{padding:5px 10px;font-size:12.5px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px 18px}
.row{display:flex;gap:12px;align-items:center}.sp{flex:1}
.pill{font-weight:700;border-radius:10px;padding:1px 9px;display:inline-block;font-size:12.5px}
.chip{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid var(--bd);background:#fff}
.chip.weg{color:#A0A6AD;text-decoration:line-through;background:var(--muted)}
/* lijst */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tab{padding:8px 12px;border-bottom:3px solid transparent;color:var(--sec);font-weight:600}.tab.on{border-color:var(--yellow);color:var(--txt)}
.tab .n{background:var(--muted);border-radius:8px;padding:0 6px;margin-left:4px;font-size:12px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--sec);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--bd)}
td{padding:9px 10px;border-bottom:1px solid var(--bd)}tr:hover td{background:var(--yellowh)}
.dots{display:inline-flex;gap:3px;margin-right:8px;vertical-align:middle}.dots i{width:9px;height:9px;border-radius:50%;background:#D1D5DB;display:inline-block}
.dots i.k{background:var(--grD)}.dots i.h{background:var(--yellow);box-shadow:0 0 0 2px #FDE68A}.dots i.o{background:repeating-linear-gradient(45deg,#D1D5DB 0 2px,#fff 2px 4px)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px 14px}.kpi b{font-size:20px;display:block}
/* dossier */
.kop{display:flex;align-items:flex-start;gap:16px}.kop .r{text-align:right}
.balk{display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px 10px}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;text-align:center}
.st:not(:last-child)::after{content:"";position:absolute;top:14px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:#D1D5DB}
.st.k:not(:last-child)::after{background:var(--grD)}
.st .b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#E5E7EB;color:#6B7280;z-index:1}
.st.k .b{background:var(--grD);color:#fff}.st.h .b{background:var(--yellow);color:#222;box-shadow:0 0 0 4px #FEF3C7}
.st.o .b{background:repeating-linear-gradient(45deg,#E5E7EB 0 3px,#fff 3px 6px);color:#9CA3AF}.st.o .t{text-decoration:line-through;color:#9CA3AF}
.st .t{font-weight:600;font-size:13px}.st .d{font-size:11.5px;color:var(--sec)}.st.h .d{color:#92400E;font-weight:600}
.voet{position:sticky;bottom:0;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px 16px;display:flex;gap:10px;align-items:center}
.g2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.inl{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:var(--muted);margin-bottom:8px}.inl.sel{border-color:var(--yellow);background:#FFFBEB;box-shadow:0 0 0 2px #FDE68A}
.inl .t{font-weight:600}.lbl{font-size:12px;color:var(--sec);margin-bottom:3px}
.inp{border:1px solid var(--bd);border-radius:8px;padding:7px 10px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}.seg span{padding:6px 12px;white-space:nowrap}.seg .on{background:var(--yellow);font-weight:600}
.sum div{display:flex;justify-content:space-between;padding:3px 0}.sum .tot{font-weight:700;font-size:16px;border-top:1px solid var(--bd);margin-top:4px;padding-top:6px}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0}.chk i{width:16px;height:16px;border-radius:4px;border:1.5px solid #9CA3AF;display:inline-grid;place-items:center;font-style:normal;font-size:11px}
.chk i.v{background:var(--grD);border-color:var(--grD);color:#fff}.chk .w{color:var(--sec);font-size:12px;margin-left:auto}
.note{border-radius:10px;padding:10px 12px;font-size:13px}.note.i{background:var(--blueBg);color:var(--blue)}.note.ok{background:var(--grBg);color:var(--gr)}.note.w{background:#FFFBEB;color:#92400E}
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);display:grid;place-items:center}
.dlg{background:#fff;border-radius:16px;width:560px;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px}
.opt{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;display:flex;gap:10px}.opt.on{border-color:var(--yellow);background:#FFFBEB}
.rad{width:16px;height:16px;border-radius:50%;border:2px solid #9CA3AF;margin-top:2px;flex:none}.on .rad{border:5px solid #D97706}
.tl div{display:flex;gap:10px;padding:4px 0}.tl b{width:90px;color:var(--sec);font-weight:500}
.lock{display:inline-flex;gap:6px;align-items:center;background:var(--grBg);color:var(--gr);border-radius:999px;padding:3px 10px;font-weight:600;font-size:12.5px}
.tag{background:#FEF3C7;color:#92400E;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600}
</style></head><body>
